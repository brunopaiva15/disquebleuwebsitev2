<!doctype html>
<!-- Gabarit de l'image de partage (1200 × 630), rendu par make-og-cover.py.
     Le couvercle est celui de la page, dessiné par assets/js/disc.js : le
     disque à 9:30, la durée autorisée en orange, l'étiquette au-dessus. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #1565c0; }
  body {
    position: relative;
    font-family: "Inter", "Liberation Sans", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
  }
  canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .tag {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    font-variant-numeric: tabular-nums;
  }
  .tag__from { font-size: 24px; font-weight: 600; color: rgba(255, 255, 255, 0.75); }
  .tag__arrow { width: 24px; height: 24px; color: rgba(255, 255, 255, 0.75); }
  .tag__pill {
    padding: 5px 16px;
    border-radius: 26px;
    background: #fff;
    color: #1565c0;
    font-size: 28px;
    font-weight: 800;
  }
  .copy {
    position: absolute;
    left: 640px;
    top: 0;
    bottom: 0;
    width: 500px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .copy h1 {
    font-size: 84px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .copy p {
    margin-top: 22px;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.86);
  }
  .copy small {
    display: block;
    margin-top: 34px;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
<canvas width="1200" height="630"></canvas>
<div class="tag">
  <span class="tag__from">9:12</span>
  <svg class="tag__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  <span class="tag__pill">9:30</span>
</div>
<div class="copy">
  <h1>Disque Bleu</h1>
  <p>L'heure à régler sur votre disque, et un rappel avant l'échéance.</p>
  <small>Suisse · France · Allemagne · Italie<br>Belgique · Luxembourg · Pays-Bas</small>
</div>
<script type="module">
  import { CoverGeometry, paintCover } from '../assets/js/disc.js';

  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const g = new CoverGeometry(330, 150, 330);

  await document.fonts.ready;
  paintCover(ctx, 1200, 630, g, { hour: 9.5, allowedHours: 1, sector: 1 });

  const tag = document.querySelector('.tag');
  tag.style.left = `${g.cx - tag.offsetWidth / 2}px`;
  tag.style.top = `${g.arrowTop - 62}px`;
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
