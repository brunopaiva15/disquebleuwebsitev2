name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; on laisse finir celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fichiers référencés présents
        run: python3 tools/check-assets.py

      - name: Syntaxe des modules JavaScript
        run: |
          for f in assets/js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Traductions complètes
        run: node tools/check-i18n.mjs

  deployer:
    name: Déploiement
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Le site est statique et servi depuis la racine : rien à compiler.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
